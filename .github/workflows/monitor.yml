name: Kairon Monitor

on:
  schedule:
    - cron: '*/15 * * * *'   # cada 15 minutos
  workflow_dispatch:           # permite ejecutar manualmente desde GitHub

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python kairon_monitor.py

      - name: Guardar estado en el repo
        run: |
          git config user.email "action@github.com"
          git config user.name "Kairon Monitor"
          git add kairon_estado.json
          git diff --staged --quiet || (git commit -m "update estado [skip ci]" && git push)
